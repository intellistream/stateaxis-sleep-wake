[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-sleep-wake"
version = "0.2.0"
description = "Experimental identity-verified StateAxis whole-worker sleep and wake policy"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-sleep-wake" = "stateaxis_sleep_wake"

[project.entry-points."stateaxis.mod_handlers"]
sleep_wake = "stateaxis_sleep_wake:sleep_wake"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_sleep_wake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
